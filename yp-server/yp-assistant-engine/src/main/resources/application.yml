server:
  port: 8081
  servlet:
    # 本项目对外统一前缀，网关按 /assistant/** 转发到本服务
    context-path: /assistant
spring:
  application:
    # 👈 核心：这个名字必须和网关里 lb://yp-assistant-engine 保持一致！
    name: yp-assistant-engine
  # 👈 注册到 Nacos
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
  datasource:
    # 注意：file:./data/chat_session 表示在项目根目录生成 data/chat_session.mv.db 文件
    url: jdbc:h2:file:./data/chat_session;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  elasticsearch:
    uris: http://192.168.101.100:9200
    # 如果你有密码就加上 username / password
  ai:
    mcp:
      client:
        # 不再配置静态连接：MCP Server 地址由 Nacos 服务发现动态解析（见 McpClientDiscoveryConfig）
        type: SYNC
        request-timeout: 30s
    session:
      repository:
        jdbc:
          initialize-schema: always # 第一次启动时自动建表
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 500
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        enabled: false
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      elasticsearch:
        index-name: financial_rag # 手动建好的索引，默认名是 spring-ai-document-index
        dimensions: 1024
        initialize-schema: false # 咱们已经手动建好 Mapping 了，关掉自动初始化

    chat:
      client:
        enabled: false

# MCP Client 动态发现配置：从 Nacos 解析 yp-agent-mcp-hub 实例，无需固定 IP:PORT
mcp:
  client:
    service-name: yp-agent-mcp-hub
    endpoint: /mcp
    request-timeout: 30s

logging:
  level:
    # 开启 Spring AI Client 的日志，用于查看请求和响应
    org.springframework.ai.chat.client.advisor: DEBUG
    # 如果你想看更底层的 HTTP 请求交互，可以加上这个（可选）
    org.springframework.ai.model: DEBUG
    # 打印底层发给 DeepSeek 的原始请求和响应
    org.springframework.web.reactive.function.client.ExchangeFunctions: DEBUG
    org.springframework.ai.chat.client: DEBUG