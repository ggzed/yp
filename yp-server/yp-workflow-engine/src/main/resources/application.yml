# MCP 服务：优先通过 Nacos 发现 yp-agent-mcp-hub，未注册时回退到 fallback-url
mcp:
  client:
    service-name: yp-agent-mcp-hub
    endpoint: /mcp
    fallback-url: http://localhost:8083