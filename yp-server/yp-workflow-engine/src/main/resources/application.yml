server:
  port: 8084
  servlet:
    # 本项目对外统一前缀，网关按 /workflow/** 转发到本服务
    context-path: /workflow
spring:
  application:
    # 👈 核心：这个名字必须和网关里 lb://yp-workflow-engine 保持一致！
    name: yp-workflow-engine
  # 👈 注册到 Nacos
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
