server:
  port: 8080
spring:
  application:
    name: yp-agent-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
    gateway:
      server:
        webflux:
          routes:
            # 每个服务使用独立前缀，前缀与各服务 controller 的 @RequestMapping 保持一致，网关透传不做改写
            - id: agent-admin-route
              uri: lb://yp-agent-admin
              predicates:
                # 管理后台：/admin/**
                - Path=/admin/**

            - id: assistant-engine-route
              uri: lb://yp-assistant-engine
              predicates:
                # 问答引擎：/assistant/**
                - Path=/assistant/**

            - id: workflow-engine-route
              uri: lb://yp-workflow-engine
              predicates:
                # 编排引擎：/workflow/**
                - Path=/workflow/**

            - id: mcp-hub-route
              uri: lb://yp-agent-mcp-hub
              predicates:
                # MCP 服务：协议端点为 /mcp，内部接口为 /mcp/internal/**
                - Path=/mcp/**

            - id: mock-business-route
              uri: lb://yp-mock-business
              predicates:
                # 业务模拟服务：/business/**
                - Path=/business/**